name: Publish APK to branch

# 일회성 전달용 워크플로 (사용자 승인 완료): 빌드한 디버그 APK를 이 브랜치에
# 커밋해 git으로 받을 수 있게 한다. 아티팩트 저장소가 차단된 환경에서
# 채팅으로 APK를 전달하기 위한 용도이며, 전달 후 제거된다.
# 키스토어는 새로 포함하지 않고 기존 android-build.yml에 커밋된 값을 재사용한다.
on:
  push:
    branches: [ claude/toeic-agent-system-xhrh2m ]
    paths: [ '.github/workflows/apk-publish.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Build APK and commit to branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable debug keystore (reuse value committed in android-build.yml)
        run: |
          mkdir -p ~/.android
          grep 'ANDROID_DEBUG_KEYSTORE_BASE64:' .github/workflows/android-build.yml \
            | head -n 1 | awk '{print $2}' | base64 -d > ~/.android/debug.keystore
          BYTES=$(wc -c < ~/.android/debug.keystore)
          echo "Restored debug.keystore ($BYTES bytes; expected 2666)"
          if [ "$BYTES" -ne 2666 ]; then
            echo "::error::Keystore size mismatch! Got $BYTES bytes, expected 2666." >&2
            exit 1
          fi

      - name: Install npm dependencies
        run: npm install --no-audit

      - name: Inject API keys into env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env.local
          echo "VITE_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.local
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env.local
          echo "VITE_YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env.local
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Restore google-services.json from secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          fi

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit APK to branch
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p release
          cp "$APK_PATH" release/toeic-app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/toeic-app-debug.apk
          git commit -m "Add built debug APK for chat delivery (temporary)"
          git push origin HEAD:claude/toeic-agent-system-xhrh2m
